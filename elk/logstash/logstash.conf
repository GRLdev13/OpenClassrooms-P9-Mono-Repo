input {
  http {
    port => 8080
    codec => json
  }

  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "environment" => "local"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}