input {
  http {
    port => 8080
    codec => json
  }

  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "environment" => "local"
    }
  }

  if [service][name] == "front" {
    json {
      source => "message"
      target => "http_access"
      skip_on_invalid_json => true
    }
  } else if [service][name] == "back" and [message] =~ /HttpRequestLoggingFilter/ {
    grok {
      match => { "message" => "(?<access_json>\{.*\})" }
      tag_on_failure => []
    }

    if [access_json] {
      json {
        source => "access_json"
        target => "http_access"
        skip_on_invalid_json => true
      }
      mutate { remove_field => ["access_json"] }
    }
  }

  if [http_access][status] {
    mutate {
      copy => {
        "[http_access][status]" => "[http][response][status_code]"
        "[http_access][request][method]" => "[http][request][method]"
        "[http_access][request][uri]" => "[url][original]"
      }
      add_field => { "[event][dataset]" => "http.access" }
    }

    if [http_access][request][route] {
      mutate {
        copy => { "[http_access][request][route]" => "[http][route]" }
      }
    } else {
      mutate {
        copy => { "[http_access][request][uri]" => "[http][route]" }
      }
    }

    mutate {
      replace => {
        "message" => "%{[http][request][method]} %{[http][route]} -> %{[http][response][status_code]}"
      }
    }

    ruby {
      code => 'duration = event.get("[http_access][duration]").to_f; event.set("[event][duration]", (duration * 1_000_000_000).round); event.set("[http_access][duration_ms]", (duration * 1_000).round(3)); cpu = event.get("[http_access][metrics][thread_cpu_ns]"); event.set("[http_access][metrics][thread_cpu_ms]", (cpu.to_f / 1_000_000).round(3)) if cpu'
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
