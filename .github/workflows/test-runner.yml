name: Project tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 6'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  backend-tests:
    name: Backend (Java / Gradle)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            back/*.gradle
            back/gradle/wrapper/gradle-wrapper.properties

      - name: Run backend tests
        working-directory: back
        run: bash ./gradlew --no-daemon test

      - name: Publish backend test report
        if: ${{ !cancelled() && hashFiles('back/build/test-results/test/*.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v3
        with:
          name: Backend test results
          path: back/build/test-results/test/*.xml
          reporter: java-junit
          use-actions-summary: "true"
          report-title: Backend test results
          list-suites: all
          list-tests: all
          fail-on-empty: "true"
          fail-on-error: "true"

      - name: Upload backend test results
        if: ${{ always() && hashFiles('back/build/test-results/test/*.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: back/build/test-results/test/*.xml

      - name: Upload backend JaCoCo report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: back/build/reports/jacoco/test/
          if-no-files-found: warn

  frontend-tests:
    name: Frontend (Angular)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm i
        working-directory: front

      - name: Run frontend tests
        working-directory: front
        run: CHROME_BIN="$(command -v google-chrome)" npm test -- --watch=false --no-progress --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Publish frontend test report
        if: ${{ !cancelled() && hashFiles('front/test-results/junit.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v3
        with:
          name: Frontend test results
          path: front/test-results/junit.xml
          reporter: java-junit
          use-actions-summary: "true"
          report-title: Frontend test results
          list-suites: all
          list-tests: all
          fail-on-empty: "true"
          fail-on-error: "true"

      - name: Upload frontend test results
        if: ${{ always() && hashFiles('front/test-results/junit.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: front/test-results/junit.xml

      - name: Upload frontend coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: front/coverage/microcrm/
          if-no-files-found: warn

  # disabled for now 
  # docker-images:
  #   name: Docker images
  #   needs: [backend-tests, frontend-tests]
  #   if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'master') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}
  #   uses: ./.github/workflows/docker-build.yml
  #   permissions:
  #     contents: read
  #     packages: write

  codeql:
    name: CodeQL
    needs: [backend-tests, frontend-tests]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/codeql-analysis.yml
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
