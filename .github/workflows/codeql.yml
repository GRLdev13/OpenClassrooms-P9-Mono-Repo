name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            queries:
              - uses: security-and-quality

      - name: Build backend
        if: matrix.language == 'java-kotlin'
        working-directory: back
        run: bash ./gradlew --no-daemon clean assemble

      - name: Analyze code
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results

      - name: Summarize findings
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        shell: bash
        run: |
          findings=$(jq -s '[.[] | .runs[]? | .results[]?] | length' codeql-results/*.sarif)
          {
            echo "### CodeQL: ${{ matrix.language }}"
            echo "Findings: **$findings**"
            echo "See **Security and quality > Code scanning** for alerts with source locations."
            echo "The SARIF report is available in this run's artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results/*.sarif
          if-no-files-found: warn
          retention-days: 14
